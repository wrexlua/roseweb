<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Rose Software — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .popup-overlay {
            position:fixed; inset:0; z-index:10000;
            background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
            display:none; align-items:center; justify-content:center;
            animation:popupFadeIn 0.25s var(--ease);
        }
        .popup-overlay.show { display:flex; }
        @keyframes popupFadeIn { from { opacity:0; } to { opacity:1; } }
        .popup-box {
            background:rgba(14,14,20,0.98); border:1px solid var(--border);
            border-radius:var(--radius); padding:32px;
            max-width:380px; width:90%; position:relative;
            text-align:center; animation:popupScaleIn 0.3s cubic-bezier(0.16,1,0.3,1);
            box-shadow:0 24px 64px rgba(0,0,0,0.5);
        }
        @keyframes popupScaleIn { from { opacity:0; transform:scale(0.85) translateY(12px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .popup-close {
            position:absolute; top:14px; right:14px;
            width:32px; height:32px; border-radius:8px;
            background:var(--surface-1); border:1px solid var(--border);
            color:var(--t3); cursor:pointer; display:flex;
            align-items:center; justify-content:center;
            transition:all var(--fast);
        }
        .popup-close:hover { background:rgba(248,113,113,0.1); border-color:rgba(248,113,113,0.3); color:var(--err); }
        .popup-icon {
            width:52px; height:52px; border-radius:14px;
            background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.25);
            display:flex; align-items:center; justify-content:center;
            color:var(--err); margin:0 auto 16px;
        }
        .popup-title { font-size:1.2rem; font-weight:700; color:var(--t1); margin-bottom:8px; }
        .popup-text { font-size:0.85rem; color:var(--t2); line-height:1.5; margin-bottom:24px; }
        .popup-btn {
            width:100%; height:42px; border-radius:var(--radius-xs);
            background:linear-gradient(135deg,var(--accent-dark),var(--accent));
            border:none; color:#fff; font-size:0.9rem; font-weight:700;
            cursor:pointer; transition:all var(--fast);
        }
        .popup-btn:hover { box-shadow:0 4px 20px var(--accent-glow); transform:translateY(-1px); }
        .popup-btn:active { transform:none; }
        /* Dashboard entrance animations */
        .dash-container { animation:containerIn 0.8s cubic-bezier(0.16,1,0.3,1) both; }
        @keyframes containerIn { from { opacity:0; transform:scale(0.92) translateY(30px); filter:blur(6px); } to { opacity:1; transform:scale(1) translateY(0); filter:blur(0); } }
        .dash-header { animation:headerIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.3s both; }
        @keyframes headerIn { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
        .dash-header-left h1 {
            animation:headerGlow 0.8s cubic-bezier(0.16,1,0.3,1) 0.5s both;
        }
        @keyframes headerGlow {
            from { opacity:0; letter-spacing:-0.1em; filter:blur(6px); }
            to   { opacity:1; letter-spacing:-0.04em; filter:blur(0); }
        }
        .dash-welcome { animation:welIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.55s both; }
        @keyframes welIn { from { opacity:0; transform:translateY(16px) scale(0.95); filter:blur(4px); } to { opacity:1; transform:translateY(0) scale(1); filter:blur(0); } }
        .expiry-badge { animation:badgeIn 0.5s cubic-bezier(0.16,1,0.3,1) 0.7s both; }
        @keyframes badgeIn { from { opacity:0; transform:translateY(10px) scale(0.9); } to { opacity:1; transform:translateY(0) scale(1); } }
        .product-grid .product-card { animation:cardIn 0.6s cubic-bezier(0.16,1,0.3,1) backwards; }
        .product-grid .product-card:nth-child(1) { animation-delay:0.85s; }
        .product-grid .product-card:nth-child(2) { animation-delay:0.95s; }
        .product-grid .product-card:nth-child(3) { animation-delay:1.05s; }
        .product-grid .product-card:nth-child(4) { animation-delay:1.15s; }
        @keyframes cardIn {
            0% { opacity:0; transform:translateY(40px) scale(0.88) rotateX(12deg); filter:blur(6px); }
            60% { filter:blur(0); }
            100% { opacity:1; transform:translateY(0) scale(1) rotateX(0); filter:blur(0); }
        }
        .product-card { will-change:transform,opacity,filter; }
        .loader-bar {
            margin-top:24px; display:flex; align-items:center; justify-content:space-between;
            background:rgba(200,80,120,0.06); border:1px solid rgba(200,80,120,0.2);
            border-radius:var(--radius); padding:16px 20px;
            animation:badgeIn 0.5s cubic-bezier(0.16,1,0.3,1) 1.2s both;
            transition:border-color var(--mid), background var(--mid);
        }
        .loader-bar:hover { border-color:rgba(200,80,120,0.35); background:rgba(200,80,120,0.09); }
        .loader-bar-left { display:flex; align-items:center; gap:14px; }
        .loader-bar-left svg { color:var(--accent); flex-shrink:0; }
        .loader-bar-title { font-weight:700; font-size:0.95rem; color:var(--t1); }
        .loader-bar-meta { font-size:0.75rem; color:var(--t3); margin-top:2px; }
        .loader-bar-btn {
            display:inline-flex; align-items:center; gap:8px; padding:10px 22px;
            background:linear-gradient(135deg,var(--accent-dark),var(--accent));
            border:none; border-radius:var(--radius-xs); color:#fff;
            font-weight:700; font-size:0.85rem; cursor:pointer;
            text-decoration:none; white-space:nowrap;
            transition:all var(--fast); box-shadow:0 4px 16px var(--accent-glow);
        }
        .loader-bar-btn:hover { transform:translateY(-2px); box-shadow:0 6px 24px var(--accent-glow); }
        .loader-bar-btn:active { transform:translateY(0); }
        @media(max-width:600px){ .loader-bar{flex-direction:column;gap:14px;align-items:stretch;text-align:center;} .loader-bar-left{justify-content:center;} .loader-bar-btn{justify-content:center;} }
    </style>
</head>
<body>

<canvas id="meshCanvas"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="noise"></div>

<div class="dash-layout">
    <div class="dash-container" id="dashContainer">

        <div class="dash-header">
            <div class="dash-header-left">
                <h1>Available products</h1>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <span id="refreshIndicator" style="font-size:0.7rem;color:var(--t3);font-family:'Space Mono',monospace;min-width:80px;text-align:right;"></span>
                <button class="dash-close" onclick="handleLogout()" title="Logout">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
                <button class="dash-close" onclick="window.location.href='/'" title="Close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>

        <div class="dash-welcome" id="dashWelcome">Loading...</div>

        <div class="expiry-badge" id="expiryBadge" style="display:none; margin-bottom: 20px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="expiryText"></span>
            <span style="margin:0 8px;opacity:0.15;">|</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span id="hwidText"></span>
        </div>

        <div class="product-grid" id="productGrid"></div>

        <div class="loader-bar" id="loaderBar" style="display:none;">
            <div class="loader-bar-left">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <div>
                    <div class="loader-bar-title">Download Loader</div>
                    <div class="loader-bar-meta" id="loaderMeta">Loading...</div>
                </div>
            </div>
            <a class="loader-bar-btn" id="loaderDownloadBtn" href="#" target="_blank">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download
            </a>
        </div>

    </div>
</div>

<div class="toast-wrap" id="toastWrap" role="status" aria-live="polite"></div>

<div class="popup-overlay" id="popupOverlay" onclick="closePopup()">
    <div class="popup-box" id="popupBox">
        <button class="popup-close" onclick="closePopup()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="popup-icon" id="popupIcon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        </div>
        <div class="popup-title" id="popupTitle">Product Unavailable</div>
        <div class="popup-text" id="popupText">This product is currently offline.</div>
        <button class="popup-btn" onclick="closePopup()">OK</button>
    </div>
</div>

<script src="assets/js/main.js"></script>
<script>
(function() {
    const session = JSON.parse(localStorage.getItem('roseSession') || 'null');
    const sessionToken = localStorage.getItem('roseSessionToken');
    if (!session || !sessionToken) { window.location.href = '/'; return; }

    const { username, products, expiry, key, locked_hwid } = session;
    const myProducts = (products || []).map(p => p.toLowerCase());

    const GRADIENTS = {
        emulator:  'linear-gradient(135deg, #1a0a1e, #3a1a2e)',
        vault:     'linear-gradient(135deg, #0a1a1a, #1a3a2a)',
        colorbot:  'linear-gradient(135deg, #0a0a2e, #1a1a5e)',
        serial:    'linear-gradient(135deg, #1a0a0a, #3a1a1a)'
    };

    const productsList = [
        { id: 'emulator', name: 'Emulator' },
        { id: 'vault',    name: 'Vault' },
        { id: 'colorbot', name: 'Colorbot' },
        { id: 'serial',   name: 'Serial' }
    ];

    document.getElementById('dashWelcome').innerHTML = 'Welcome back, <strong>' + escapeHtml(username) + '</strong>';
    document.getElementById('expiryBadge').style.display = 'inline-flex';
    document.getElementById('expiryText').textContent = 'Key expires: ' + expiry;
    document.getElementById('hwidText').textContent = locked_hwid ? 'HWID: ' + locked_hwid : 'HWID: Not locked';

    let refreshTimer = null;
    let countdownValue = 30;
    const indicator = document.getElementById('refreshIndicator');

    /* ── Session validator (3 sn, multi-factor) ────────── */
    async function validateSession() {
        try {
            const r = await fetch('/api/check-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: sessionToken })
            });
            const d = await r.json();
            const key = session.key;
            const expectedChk = await sha256Hex(key + '::' + d.valid + '::' + d.ok + '::' + d.stat);
            const valid = d.valid === true && d.ok === true && d.stat === 1 && d.chk === expectedChk.slice(0, 16);
            if (!valid) {
                localStorage.removeItem('roseSession');
                localStorage.removeItem('roseSessionToken');
                window.location.href = '/';
            } else if (d.data) {
                // Update stored session with latest data (e.g. HWID)
                const s = JSON.parse(localStorage.getItem('roseSession') || '{}');
                if (d.data.locked_hwid !== undefined) s.locked_hwid = d.data.locked_hwid;
                localStorage.setItem('roseSession', JSON.stringify(s));
                document.getElementById('hwidText').textContent = d.data.locked_hwid ? 'HWID: ' + d.data.locked_hwid : 'HWID: Not locked';
            }
        } catch(e) {
            localStorage.removeItem('roseSession');
            localStorage.removeItem('roseSessionToken');
            window.location.href = '/';
        }
    }
    validateSession();
    setInterval(validateSession, 3000);

    /* ── Product status fetcher with countdown ─────────── */
    function fetchStatuses() {
        indicator.textContent = 'refreshing...';
        fetch('/api/config/products')
            .then(r => r.json())
            .then(d => {
                if (d.success) renderProducts(d.products);
                startCountdown();
            })
            .catch(() => startCountdown());
    }

    function startCountdown() {
        if (refreshTimer) clearInterval(refreshTimer);
        countdownValue = 30;
        indicator.textContent = countdownValue + 's';
        refreshTimer = setInterval(() => {
            countdownValue--;
            indicator.textContent = countdownValue + 's';
            if (countdownValue <= 0) {
                clearInterval(refreshTimer);
                fetchStatuses();
            }
        }, 1000);
    }

    let gridBuilt = false;

    function renderProducts(configProducts) {
        const grid = document.getElementById('productGrid');
        const statusMap = {}, updateMap = {};
        (configProducts || []).forEach(cp => {
            statusMap[cp.id] = cp.status || 'OFFLINE';
            updateMap[cp.id] = cp.lastUpdate || '-';
        });

        if (!gridBuilt) {
            // First render — build full HTML with entrance animations
            grid.innerHTML = productsList.map(p => {
                const allowed = myProducts.includes(p.id) || myProducts.includes(p.name.toLowerCase());
                const status = statusMap[p.id] || 'OFFLINE';
                const lastUp = updateMap[p.id] || '-';
                const sc = status.toLowerCase();
                const statusColor = status === 'ONLINE' ? 'var(--ok)' : status === 'MAINTENANCE' ? 'var(--warn)' : 'var(--err)';

                return '' +
                    '<div class="product-card' + (allowed ? '' : ' no-access') + '" data-id="' + p.id + '">' +
                        '<div class="product-banner">' +
                            '<div class="banner-bg" style="background:' + (GRADIENTS[p.id] || 'var(--surface-1)') + '"></div>' +
                            '<div class="banner-status-row">' +
                                '<div class="status-dot ' + sc + '"></div>' +
                                '<span class="status-label" style="color:' + statusColor + '">' + status + '</span>' +
                            '</div>' +
                            (!allowed ? '<div class="access-lock"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>' : '') +
                            '<span class="banner-text">' + p.name + '</span>' +
                        '</div>' +
                        '<div class="product-footer">' +
                            '<div class="product-update">' +
                                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>' +
                                '<div class="update-label"><span>Last update</span><span class="update-date">' + lastUp + '</span></div>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
            }).join('');
            gridBuilt = true;
        } else {
            // Refresh — only update status dots & labels in place
            document.querySelectorAll('.product-card').forEach(card => {
                const id = card.dataset.id;
                if (!id) return;
                const status = statusMap[id] || 'OFFLINE';
                const sc = status.toLowerCase();
                const statusColor = status === 'ONLINE' ? 'var(--ok)' : status === 'MAINTENANCE' ? 'var(--warn)' : 'var(--err)';
                const dot = card.querySelector('.status-dot');
                const label = card.querySelector('.status-label');
                if (dot) { dot.className = 'status-dot ' + sc; }
                if (label) { label.textContent = status; label.style.color = statusColor; }
            });
        }

        // Fetch loader info
        fetch('/api/config/loader').then(r => r.json()).then(d => {
            const bar = document.getElementById('loaderBar');
            const btn = document.getElementById('loaderDownloadBtn');
            const meta = document.getElementById('loaderMeta');
            if (d.success && d.url) {
                btn.href = d.url;
                meta.textContent = (d.filename || 'Loader') + ' · v' + (d.version || '?') + (d.updated ? ' · ' + d.updated : '');
            } else {
                btn.removeAttribute('href');
                btn.onclick = function(e){ e.preventDefault(); showToast('No loader uploaded yet.','info'); };
                meta.textContent = 'No loader file available — contact admin.';
            }
            bar.style.display = 'flex';
        }).catch(() => {
            document.getElementById('loaderBar').style.display = 'flex';
        });
    }

    fetchStatuses();
})();

async function sha256Hex(str) {
    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function handleLogout() {
    localStorage.removeItem('roseSession');
    localStorage.removeItem('roseSessionToken');
    window.location.href = '/';
}

function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = String(str || '');
    return d.innerHTML;
}

function showPopup(status) {
    const overlay = document.getElementById('popupOverlay');
    const title = document.getElementById('popupTitle');
    const text = document.getElementById('popupText');
    const icon = document.getElementById('popupIcon');
    const statusLower = status.toLowerCase();
    const statusColor = status === 'ONLINE' ? 'var(--ok)' : status === 'MAINTENANCE' ? 'var(--warn)' : 'var(--err)';
    title.textContent = 'Product ' + status;
    text.textContent = 'This product is currently ' + statusLower + '. Downloads are disabled until the status returns to ONLINE.';
    icon.style.color = statusColor;
    icon.style.background = status === 'MAINTENANCE' ? 'rgba(250,204,21,0.1)' : 'rgba(248,113,113,0.1)';
    icon.style.borderColor = status === 'MAINTENANCE' ? 'rgba(250,204,21,0.25)' : 'rgba(248,113,113,0.25)';
    overlay.classList.add('show');
    if (window._popupTimer) clearTimeout(window._popupTimer);
    window._popupTimer = setTimeout(closePopup, 5000);
}
function closePopup() {
    document.getElementById('popupOverlay').classList.remove('show');
    if (window._popupTimer) { clearTimeout(window._popupTimer); window._popupTimer = null; }
}
</script>
</body>
</html>
